<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <rect width="820" height="220" rx="14" fill="#ffffff" stroke="#e2d3bf" stroke-width="1.5"/>

  <!-- Colonne Avant -->
  <g transform="translate(20, 18)">
    <rect width="380" height="184" rx="10" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
    <text x="18" y="28" font-family="'Proza Libre', Georgia, serif" font-size="14.5" font-weight="bold" fill="#82072a">AVANT (MÉTHODE MANUELLE)</text>
    
    <g transform="translate(18, 48)" font-family="Arial, sans-serif" font-size="11.5" fill="#404040">
      <text y="14">⚠️ <tspan font-weight="bold">1h30 à 2h passées chaque matin</tspan> à évaluer 600 articles.</text>
      <text y="38">⚠️ <tspan font-weight="bold">Calcul au doigt mouillé</tspan> : météo et ponts mal anticipés.</text>
      <text y="62">⚠️ <tspan font-weight="bold">Risque de sur-commande</tspan> : casse, pourrissement, pertes.</text>
      <text y="86">⚠️ <tspan font-weight="bold">Stress intense avant 9h30</tspan> : aucun rattrapage en journée.</text>
      <text y="110">⚠️ <tspan font-weight="bold">Factures directes oubliées</tspan> : stocks magasin faussés.</text>
    </g>
  </g>

  <!-- Colonne Après -->
  <g transform="translate(420, 18)">
    <rect width="380" height="184" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="18" y="28" font-family="'Proza Libre', Georgia, serif" font-size="14.5" font-weight="bold" fill="#00674f">AVEC L'ASSISTANT RAYON (AUJOURD'HUI)</text>
    
    <g transform="translate(18, 48)" font-family="Arial, sans-serif" font-size="11.5" fill="#1f2937">
      <text y="14">✅ <tspan font-weight="bold" fill="#00674f">15 minutes suffisent</tspan> pour relire et valider sereinement.</text>
      <text y="38">✅ <tspan font-weight="bold" fill="#00674f">Calcul exact et documenté</tspan> fondé sur les ventes réelles.</text>
      <text y="62">✅ <tspan font-weight="bold" fill="#00674f">Maîtrise de la casse (~3%)</tspan> et marge brute protégée.</text>
      <text y="86">✅ <tspan font-weight="bold" fill="#00674f">Sérénité d'équipe</tspan> : proposition prête dès 8h00.</text>
      <text y="110">✅ <tspan font-weight="bold" fill="#00674f">L'humain garde le contrôle</tspan> et valide chaque chiffre.</text>
    </g>
  </g>
</svg>